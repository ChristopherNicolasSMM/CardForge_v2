{% extends "base.html" %}
{% block title %}{{ title }} · Manual{% endblock %}
{% block content %}
  <div class="page-head">
    <div>
      <span class="eyebrow">manual</span>
      <h1>{{ title }}</h1>
    </div>
  </div>

  <div class="wiki-grid">
    <nav class="wiki-nav">
      {% for d in docs %}
        <a href="{{ url_for('wiki_bp.page', slug=d.slug) }}" class="{{ 'active' if d.slug == slug }}">{{ d.title }}</a>
      {% endfor %}
    </nav>

    <article class="wiki-content">
      {{ content|safe }}
    </article>

    {% if toc %}
      <nav class="wiki-toc">
        <div class="wiki-toc-label">nesta página</div>
        {% for item in toc %}
          <a href="#{{ item.id }}" class="toc-l{{ item.level }}">{{ item.name }}</a>
        {% endfor %}
      </nav>
    {% endif %}
  </div>
{% endblock %}
